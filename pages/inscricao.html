    <!--end faca-mais-->

    <div class="container">
        <!-- Title section -->
        <div class="title">Formulário de inscrição</div>
        <div class="content">
          <!-- Registration form -->
          <form action="#">
            <div class="user-details">
              <!-- Input for Full Name -->
              <div class="input-box">
                <span class="details">Nome completo</span>
                <input type="text" placeholder="" required>
              </div>
              <!-- Input for Username -->
              <div class="input-box">
                <span class="details">Email</span>
                <input type="email" placeholder="" required>
              </div>
              <!-- Input for Email -->
              <div class="input-box">
                <span class="details">Telefone</span>
                <input type="tel" placeholder="" required>
              </div>
              <!-- Input for Phone Number -->
              <div class="input-box">
                <span class="details">Numero de identificação(BI)</span>
                <input type="tel" placeholder="" required>
              </div>
              <!-- Input for Password -->
              <div class="input-box">
                <span class="details">Foto(passe)</span>
                <input type="file" name="foto_passe" id="foto_passe" required>
              </div>
              <!-- Input for Confirm Password -->
              <div class="input-box">
                <span class="details">Documento de identificação(BI)</span>
                <input type="file"  required>
              </div>
            </div>
            <div class="gender-details">
              <!-- Radio buttons for gender selection -->
              
              <span class="gender-title">Sexo</span>
              <div class="category">
                  <select name="" id="">
                      <option value="">Masculino</option>
                      <option value="">Feminino</option>

                  </select>
        
              </div>
            </div>

           <div class="curso">
               <label for="">Curso</label><br>
               <select name="" id="">
                   <option value="">Informática</option>
                   <option value="">Electricidade</option>
               </select>
           </div>
            <!-- Submit button -->
            <div class="button">
              <input type="submit" value="Enviar candidatura">
            </div>
          </form>
        </div>
      </div>
