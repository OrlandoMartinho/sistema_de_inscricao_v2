<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Login</title>

    <link rel="stylesheet" href="../../css/admin/login.css">
   
</head>
<body>
    <header style="background-image: url('../../img/background-home.jpg'); height: 150px;">
        <div class="container">
            <nav>
                <a href="../index.html" class="logo">IP30SET</a>
            </nav>
        </div>
    </header>

    <section class="admin-login">
        <h2>Área de Administração</h2>
        <form action="admin-dashboard.html">
            <div class="form-group">
                <label for="username">Nome de Usuário</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>
            </div>
            <a href="admin-dashboard.html"><button type="submit" class="login-btn" >Entrar</button></a>
            
        </form>
    </section>
</body>
</html>
